[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "stabilization-uplift"
dynamic = ["version"]
description = "Stabilization Score (SS) and Stabilization Uplift (SU) metrics for evaluating model drift under distribution shocks"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [
  { name = "zypl.ai" },
]
keywords = ["model drift", "distribution shift", "concept drift", "stability", "metrics", "credit scoring", "synthetic data"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["numpy>=1.21"]

[project.optional-dependencies]
shift = ["pandas>=1.5", "sdv>=1.12", "sdmetrics>=0.14"]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/zypl-ai/stabilization_uplift"
Paper = "https://openreview.net/forum?id=zfTaFD0B5Z"
arXiv = "https://arxiv.org/abs/2510.09294"
Dataset = "https://huggingface.co/datasets/zyplai/stabilization-uplift"
Issues = "https://github.com/zypl-ai/stabilization_uplift/issues"

[tool.hatch.version]
path = "src/stabilization_uplift/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/stabilization_uplift"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE", "pyproject.toml"]

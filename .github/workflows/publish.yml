name: Publish package to PyPI

on:
  push:
    tags:
      - "stabilization-uplift-v*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build
        run: |
          python -m pip install --upgrade build pytest
          python -m build package --outdir dist

      - name: Check tag matches package version
        run: |
          pip install dist/*.whl
          version=$(python -c "import stabilization_uplift; print(stabilization_uplift.__version__)")
          if [ "${GITHUB_REF_NAME}" != "stabilization-uplift-v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package version ${version}"
            exit 1
          fi

      - name: Test
        run: pytest package/tests

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/stabilization-uplift
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
